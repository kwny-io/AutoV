# S14 · 道具资产
# 由 contracts/service-catalog.v2.json 生成，勿手工编辑；改动请改 catalog。

service_id: S14
slug: prop-assets
name: 道具资产
maturity: design_only

domain: assets
owner_team: assets
schema_owner: prop_assets
deployment_unit: prop-assets

# 数据所有权：本服务是下列事实的唯一写者
data_owner: PropRevision/尺寸外观/文字/开合破损变体；持有者历史由S16管理

api:
  command: POST /props/{id}/revisions
  query: GET /props/{id}/revisions/{revision}

publishes:
  - event_type: asset.prop.revision.accepted
    topic: drama.prop-assets.v2
    retention_days: 14

depends_on:
  - S28
  - S01

runtime:
  scaling: 按道具数量和图像生成量扩容
  recovery: 无法读取关键道具版本时禁止以文字临时代替必需参考

acceptance: 同道具跨集外观稳定；持有关系与外观来源可区分

# SLO 为 docs/03 的规划目标，尚未实测
slo:
  verified: false
