  - S08
  - S02
  - S22
  - S23

runtime:
  scaling: 按cell和任务类型独立Temporal队列；限制扇出与历史大小
  recovery: Replay-safe Workflow；所有I/O在Activities；Continue-As-New跨run幂等

acceptance: 数千子任务重启后续跑；暂停阻止新准入并继续结算已提交任务

