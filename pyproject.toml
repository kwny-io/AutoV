[tool.pytest.ini_options]
# 各服务的 src/api 目录各自独立发布，测试要能把它们当普通包导入，
# 所以路径在这里统一声明，而不是要求跑测试的人先手工设 PYTHONPATH。
pythonpath = [
    "platform/idempotency-sdk/src",
    "platform/event-sdk/src",
    "platform/auth-sdk/src",
    "services/tenant-access/src",
    "services/tenant-access/api",
    "services/revision-snapshot/src",
    "services/revision-snapshot/api",
    "services/lineage-impact/src",
    "services/lineage-impact/api",
    "services/artifact-ingest/src",
    "services/artifact-ingest/api",
    "services/model-registry/src",
    "services/model-registry/api",
    "services/budget-ledger/src",
    "services/budget-ledger/api",
    "services/scheduler-quota/src",
    "services/scheduler-quota/api",
    "services/orchestration/src",
    "services/orchestration/api",
    "services/generation-jobs/src",
    "services/generation-jobs/api",
    "services/provider-connectors/src",
    "services/provider-connectors/api",
    "services/governance-policy/src",
    "services/governance-policy/api",
    "services/story-memory/src",
    "services/story-memory/api",
    "services/continuity/src",
    "services/continuity/api",
    "services/context-retrieval/src",
    "services/context-retrieval/api",
    "services/human-review/src",
    "services/human-review/api",
    "services/project-catalog/src",
    "services/project-catalog/api",
]
testpaths = ["services", "platform"]
