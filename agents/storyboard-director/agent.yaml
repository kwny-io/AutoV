# storyboard-director · 分镜导演

role: storyboard-director
display_name: "分镜导演"
responsibility: "分镜、景别、机位与运镜"
runtime_service: S19-agent-runtime
status: design_only

# Agent 只返回候选结构，业务状态归 S04/S05/S06 等领域服务
