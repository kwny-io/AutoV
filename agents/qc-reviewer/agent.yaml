# qc-reviewer · QC评审

role: qc-reviewer
display_name: "QC评审"
responsibility: "技术/语义质检结论与缺陷分级"
runtime_service: S19-agent-runtime
status: design_only

# Agent 只返回候选结构，业务状态归 S04/S05/S06 等领域服务
authority: proposal_only

# 独立 Deployment / Task Queue / 工具白名单 / 费用限额，不共用无限额进程池
deployment:
  task_queue: agent-qc-reviewer
  image_binding: unassigned
  limits:
    tokens: unassigned
    cost: unassigned
    steps: unassigned

tools: []
evals: []
