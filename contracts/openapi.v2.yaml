            application/json:
              schema:
                type: object
                properties:
                  budget_id: *id001
                  currency: *id001
                  limit_micro: *id004
                  consumed_micro: *id004
                  outstanding_reserved_micro: *id004
                  pending_reconciliation:
                    type: boolean
                required:
                - budget_id
                - currency
                - limit_micro
                - consumed_micro
                - outstanding_reserved_micro
                - pending_reconciliation
