  /series/{series_id}/memory/query:
    post:
      operationId: queryMemory
      x-service-id: S16
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkpoint: &id004
                    type: integer
                    minimum: 0
                  claims:
                    type: array
                    items:
                      $ref: memory-claim.v2.schema.json
                required:
                - checkpoint
                - claims
                additionalProperties: false
        default:
          description: Domain/auth/transport error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_id: *id001
                minimum_checkpoint: *id004
                story_tick: *id004
