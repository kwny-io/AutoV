openapi: 3.1.0
info:
  title: Enterprise Drama Platform API
  version: 2.0.0-design
  description: 核心API设计，非完整48服务实现。tenant/actor/home_cell由可信认证派生；客户端context仅能断言预期引用，不自授权限。所有读查询不得隐式付费。
servers:
- url: https://api.example.invalid/v2
  description: placeholder
security:
- bearerAuth: []
paths:
  /episodes/{episode_id}/runs:
    post:
      operationId: createEpisodeRun
      x-service-id: S21
      responses:
        '202':
          description: Accepted asynchronous operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Domain/auth/transport error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context: &id002
                  $ref: execution-context.v2.schema.json
                budget_scope_id: &id001
                  type: string
                  minLength: 1
                command_id: *id001
              required:
              - context
              - budget_scope_id
              - command_id
              additionalProperties: false
      parameters:
      - name: episode_id
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
  /runs/{run_id}:
