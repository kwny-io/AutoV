components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Operation:
      type: object
      properties:
        operation_id: *id001
        state:
          enum:
          - accepted
          - waiting_input
          - waiting_review
          - waiting_budget
          - waiting_memory
        run_id: *id001
      required:
      - operation_id
      - state
      additionalProperties: false
    Error:
      type: object
      properties:
        code: *id001
        message: *id001
        retryable:
          type: boolean
        correlation_id: *id001
        details:
          type: object
      required:
      - code
      - message
      - retryable
      - correlation_id
      additionalProperties: false
    Run:
      type: object
      properties:
        run_id: *id001
        manifest_revision: *id003
        execution_fence: *id003
        state:
          enum:
          - QUEUED
          - RUNNING
          - WAITING_INPUT
          - WAITING_REVIEW
          - WAITING_MEMORY
          - WAITING_BUDGET
          - PAUSED
          - SUCCEEDED
          - INCOMPLETE
          - FAILED
          - CANCELED
        completed_nodes: *id004
        blocked_nodes: *id004
        projection_watermark: *id004
      required:
      - run_id
      - manifest_revision
      - execution_fence
      - state
      - completed_nodes
      - blocked_nodes
      - projection_watermark
      additionalProperties: false
